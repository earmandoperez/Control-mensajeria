<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Mensajería</title>
    <!-- Firebase v8 CDN -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-firestore.js"></script>

    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f4f7f6; color: #333; }
        header { background: #1a252f; color: white; padding: 15px; text-align: center; position: relative; }
        #logout-btn { position: absolute; right: 15px; top: 15px; background: #e74c3c; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; display: none; }
        .container { padding: 20px; max-width: 600px; margin: auto; }
        
        /* Login */
        #login-view { display: flex; flex-direction: column; gap: 15px; margin-top: 50px; }
        .login-box { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .login-box h2 { text-align: center; margin-bottom: 20px; }
        
        /* App */
        #app-view { display: none; }
        .tabs { display: flex; gap: 5px; margin-bottom: 20px; overflow-x: auto; }
        .tab-btn { flex: 1; padding: 10px; border: none; background: #ddd; cursor: pointer; border-radius: 5px 5px 0 0; font-weight: bold; white-space: nowrap; }
        .tab-btn.active { background: #2c3e50; color: white; }
        #tab-reportes { display: none; } /* Oculto por defecto */
        
        .tab-content { display: none; background: white; padding: 20px; border-radius: 0 5px 5px 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .tab-content.active { display: block; }
        
        input, select, button { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        button { background: #27ae60; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:active { background: #219150; }
        .btn-blue { background: #3498db; }
        .btn-blue:active { background: #2980b9; }

        /* Reportes */
        .report-summary { background: #ecf0f1; padding: 15px; border-radius: 5px; margin-bottom: 15px; }
        .report-summary h3 { margin-bottom: 10px; }
        .report-item { display: flex; justify-content: space-between; border-bottom: 1px solid #ddd; padding: 8px 0; font-size: 14px; }
        .text-green { color: #27ae60; font-weight: bold; }
        .text-red { color: #e74c3c; font-weight: bold; }
        .text-blue { color: #2980b9; font-weight: bold; font-size: 18px;}

        /* Modal */
        #modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 1000; }
        .modal-box { background: white; padding: 25px; border-radius: 8px; width: 90%; max-width: 400px; text-align: center; }
        .modal-box h3 { margin-bottom: 15px; }
        .modal-data { font-size: 18px; margin-bottom: 20px; text-align: left; background: #f9f9f9; padding: 15px; border-radius: 5px; }
        .modal-buttons { display: flex; gap: 10px; }
        .btn-cancel { background: #e74c3c; }
    </style>
</head>
<body>

<header>
    <h1>Control de Repartos</h1>
    <button id="logout-btn" onclick="cerrarSesion()">Salir</button>
</header>

<div class="container">
    <!-- VISTA DE LOGIN -->
    <div id="login-view" class="login-box">
        <h2>Iniciar Sesión</h2>
        <input type="email" id="email" placeholder="Correo electrónico">
        <input type="password" id="password" placeholder="Contraseña">
        <button onclick="iniciarSesion()" class="btn-blue">Entrar</button>
        <p id="login-error" style="color:red; text-align:center; display:none;"></p>
    </div>

    <!-- VISTA PRINCIPAL APP -->
    <div id="app-view">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('entregas')">Entregas</button>
            <button class="tab-btn" onclick="switchTab('gastos')">Gastos</button>
            <button class="tab-btn" onclick="switchTab('clientes')">Clientes</button>
            <button class="tab-btn" id="tab-reportes" onclick="switchTab('reportes')">Reportes</button>
        </div>

        <!-- Tab Entregas -->
        <div id="entregas" class="tab-content active">
            <h3>Registrar Entrega</h3>
            <label>Cliente / Destino:</label>
            <select id="entrega-cliente" onchange="verificarSeleccionCliente()">
                <option value="">Seleccione un cliente...</option>
                <!-- Clientes cargados dinámicamente -->
            </select>
            <input type="text" id="entrega-otro" placeholder="Escriba el nombre del cliente" style="display:none;">
            
            <label>Valor Cobrado ($):</label>
            <input type="number" id="entrega-valor" placeholder="Ej: 86500">
            <button onclick="prepararEntrega()">Guardar Entrega</button>
        </div>

        <!-- Tab Gastos -->
        <div id="gastos" class="tab-content">
            <h3>Registrar Gasto</h3>
            <label>Concepto:</label>
            <select id="gasto-concepto">
                <option value="Combustible">Combustible</option>
                <option value="Peaje">Peaje</option>
                <option value="Mantenimiento">Mantenimiento</option>
                <option value="Otro">Otro</option>
            </select>
            <label>Valor ($):</label>
            <input type="number" id="gasto-valor" placeholder="Ej: 20000">
            <button onclick="prepararGasto()">Guardar Gasto</button>
        </div>

        <!-- Tab Clientes -->
        <div id="clientes" class="tab-content">
            <h3>Nuevo Cliente Recurrente</h3>
            <label>Nombre del Cliente:</label>
            <input type="text" id="nuevo-cliente-nombre" placeholder="Ej: Panadería El Trigal">
            <button onclick="guardarCliente()">Guardar Cliente</button>
            <p id="msg-cliente" style="color:green; margin-top:10px; text-align:center;"></p>
        </div>

        <!-- Tab Reportes -->
        <div id="reportes" class="tab-content">
            <h3>Cuadre Diario</h3>
            <input type="date" id="reporte-fecha">
            <button class="btn-blue" onclick="generarReporte()">Generar Reporte</button>
            
            <div id="reporte-resultados" style="display:none; margin-top:20px;">
                <div class="report-summary">
                    <p>Total Ingresos: <span id="res-ingresos" class="text-green">$0</span></p>
                    <p>Total Gastos: <span id="res-gastos" class="text-red">$0</span></p>
                    <hr style="margin:10px 0;">
                    <p><strong>Neto a Entregar: <span id="res-neto" class="text-blue">$0</span></strong></p>
                </div>
                <h4>Detalle de Movimientos</h4>
                <div id="lista-movimientos"></div>
            </div>
        </div>
    </div>
</div>

<!-- MODAL DE CONFIRMACIÓN -->
<div id="modal-overlay">
    <div class="modal-box">
        <h3>Confirmar Operación</h3>
        <div class="modal-data" id="modal-content">
            <!-- Contenido dinámico -->
        </div>
        <div class="modal-buttons">
            <button class="btn-cancel" onclick="cerrarModal()">Cancelar</button>
            <button class="btn-blue" id="btn-confirmar-modal">Confirmar</button>
        </div>
    </div>
</div>

<script>
    // 1. Configuración de Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyAN1TVPw6FLCzfhmQErOJzGT67mPLPWPAM",
        authDomain: "control-mensajeros-db12f.firebaseapp.com",
        projectId: "control-mensajeros-db12f",
        storageBucket: "control-mensajeros-db12f.firebasestorage.app",
        messagingSenderId: "191235884534",
        appId: "1:191235884534:web:b733d6762d37ce023373d7",
        measurementId: "G-FVFMQBQGP0"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const ADMIN_EMAIL = 'admin@bigbites.co';
    let accionPendiente = null;

    // 2. Control de Autenticación
    auth.onAuthStateChanged(user => {
        if (user) {
            document.getElementById('login-view').style.display = 'none';
            document.getElementById('app-view').style.display = 'block';
            document.getElementById('logout-btn').style.display = 'inline-block';
            
            if (user.email && user.email.toLowerCase() === ADMIN_EMAIL.toLowerCase()) {
                document.getElementById('tab-reportes').style.display = 'inline-block';
            } else {
                document.getElementById('tab-reportes').style.display = 'none';
                if(document.getElementById('reportes').classList.contains('active')){
                    switchTab('entregas');
                }
            }
            cargarClientes();
            document.getElementById('reporte-fecha').valueAsDate = new Date();
        } else {
            document.getElementById('login-view').style.display = 'flex';
            document.getElementById('app-view').style.display = 'none';
            document.getElementById('logout-btn').style.display = 'none';
        }
    });

    function iniciarSesion() {
        const email = document.getElementById('email').value;
        const pass = document.getElementById('password').value;
        const errorMsg = document.getElementById('login-error');
        
        auth.signInWithEmailAndPassword(email, pass)
            .catch(error => {
                errorMsg.style.display = 'block';
                errorMsg.innerText = "Error: " + error.message;
            });
    }

    function cerrarSesion() {
        auth.signOut();
    }

    // 3. Control de Pestañas (UI)
    function switchTab(tabId) {
        document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        
        document.getElementById(tabId).classList.add('active');
        event.currentTarget.classList.add('active');
    }

    function formatearDinero(numero) {
        return new Intl.NumberFormat('es-CO', { style: 'currency', currency: 'COP', minimumFractionDigits: 0 }).format(numero);
    }

    // 4. Gestión de Clientes
    function cargarClientes() {
        db.collection('clientes').orderBy('nombre').onSnapshot(snapshot => {
            const select = document.getElementById('entrega-cliente');
            select.innerHTML = '<option value="">Seleccione un cliente...</option>';
            
            snapshot.forEach(doc => {
                const opt = document.createElement('option');
                opt.value = doc.data().nombre;
                opt.innerText = doc.data().nombre;
                select.appendChild(opt);
            });
            
            // Opciones estáticas al final
            select.innerHTML += '<option value="otros">Otros</option>';
            select.innerHTML += '<option value="crear_nuevo">➕ Crear nuevo cliente recurrente</option>';
        });
    }

    function verificarSeleccionCliente() {
        const val = document.getElementById('entrega-cliente').value;
        const inputOtro = document.getElementById('entrega-otro');
        
        if (val === 'otros') {
            inputOtro.style.display = 'block';
        } else if (val === 'crear_nuevo') {
            inputOtro.style.display = 'none';
            document.getElementById('entrega-cliente').value = ""; // Reset
            switchTab('clientes');
            // Simular clic en el botón de la pestaña para que se ilumine
            document.querySelectorAll('.tab-btn')[2].click(); 
        } else {
            inputOtro.style.display = 'none';
        }
    }

    function guardarCliente() {
        const nombre = document.getElementById('nuevo-cliente-nombre').value.trim();
        if (!nombre) return alert('Escriba un nombre válido');

        db.collection('clientes').add({ nombre: nombre })
            .then(() => {
                document.getElementById('nuevo-cliente-nombre').value = '';
                const msg = document.getElementById('msg-cliente');
                msg.innerText = 'Cliente guardado correctamente';
                setTimeout(() => msg.innerText = '', 3000);
            })
            .catch(error => alert('Error al guardar: ' + error.message));
    }

    // 5. Modal de Confirmación
    function abrirModal(htmlContent, callbackConfirmacion) {
        document.getElementById('modal-content').innerHTML = htmlContent;
        document.getElementById('modal-overlay').style.display = 'flex';
        
        const btnConfirmar = document.getElementById('btn-confirmar-modal');
        btnConfirmar.onclick = () => {
            btnConfirmar.disabled = true;
            btnConfirmar.innerText = 'Guardando...';
            callbackConfirmacion().then(() => {
                cerrarModal();
                btnConfirmar.disabled = false;
                btnConfirmar.innerText = 'Confirmar';
            }).catch(err => {
                alert('Error: ' + err.message);
                btnConfirmar.disabled = false;
                btnConfirmar.innerText = 'Confirmar';
            });
        };
    }

    function cerrarModal() {
        document.getElementById('modal-overlay').style.display = 'none';
    }

    // 6. Entregas y Gastos
    function prepararEntrega() {
        let cliente = document.getElementById('entrega-cliente').value;
        if (cliente === 'otros') {
            cliente = document.getElementById('entrega-otro').value;
        }
        const valor = parseFloat(document.getElementById('entrega-valor').value);

        if (!cliente || isNaN(valor) || valor <= 0) {
            return alert('Complete el cliente y un valor válido.');
        }

        const html = `
            <div style="text-align:center; font-weight:bold; color:#27ae60; margin-bottom:10px;">TIPO: INGRESO</div>
            <div><strong>Cliente:</strong> ${cliente}</div>
            <div><strong>Valor:</strong> ${formatearDinero(valor)}</div>
        `;

        abrirModal(html, () => {
            return db.collection('entregas').add({
                cliente: cliente,
                valor: valor,
                fecha: new Date().toISOString(),
                usuario: auth.currentUser.email
            }).then(() => {
                document.getElementById('entrega-cliente').value = '';
                document.getElementById('entrega-otro').style.display = 'none';
                document.getElementById('entrega-otro').value = '';
                document.getElementById('entrega-valor').value = '';
            });
        });
    }

    function prepararGasto() {
        const concepto = document.getElementById('gasto-concepto').value;
        const valor = parseFloat(document.getElementById('gasto-valor').value);

        if (!concepto || isNaN(valor) || valor <= 0) {
            return alert('Ingrese un concepto y un valor válido.');
        }

        const html = `
            <div style="text-align:center; font-weight:bold; color:#e74c3c; margin-bottom:10px;">TIPO: GASTO</div>
            <div><strong>Concepto:</strong> ${concepto}</div>
            <div><strong>Valor:</strong> ${formatearDinero(valor)}</div>
        `;

        abrirModal(html, () => {
            return db.collection('gastos').add({
                concepto: concepto,
                valor: valor,
                fecha: new Date().toISOString(),
                usuario: auth.currentUser.email
            }).then(() => {
                document.getElementById('gasto-concepto').value = 'Combustible';
                document.getElementById('gasto-valor').value = '';
            });
        });
    }

    // 7. Reportes (Solo Admin)
    async function generarReporte() {
        const fechaSelect = document.getElementById('reporte-fecha').value;
        if (!fechaSelect) return alert('Seleccione una fecha');

        const inicioDia = new Date(fechaSelect + 'T00:00:00').toISOString();
        const finDia = new Date(fechaSelect + 'T23:59:59').toISOString();

        let totalIngresos = 0;
        let totalGastos = 0;
        const movimientos = [];

        try {
            // Consultar Entregas
            const entregasSnap = await db.collection('entregas')
                .where('fecha', '>=', inicioDia)
                .where('fecha', '<=', finDia)
                .get();

            entregasSnap.forEach(doc => {
                const data = doc.data();
                totalIngresos += data.valor;
                movimientos.push({ tipo: 'ingreso', texto: `Cobro: ${data.cliente}`, valor: data.valor, hora: new Date(data.fecha) });
            });

            // Consultar Gastos
            const gastosSnap = await db.collection('gastos')
                .where('fecha', '>=', inicioDia)
                .where('fecha', '<=', finDia)
                .get();

            gastosSnap.forEach(doc => {
                const data = doc.data();
                totalGastos += data.valor;
                movimientos.push({ tipo: 'gasto', texto: `Gasto: ${data.concepto}`, valor: data.valor, hora: new Date(data.fecha) });
            });

            // Renderizar Resultados
            document.getElementById('res-ingresos').innerText = formatearDinero(totalIngresos);
            document.getElementById('res-gastos').innerText = formatearDinero(totalGastos);
            document.getElementById('res-neto').innerText = formatearDinero(totalIngresos - totalGastos);

            // Ordenar por hora y mostrar
            movimientos.sort((a, b) => a.hora - b.hora);
            const listaHtml = movimientos.map(m => {
                const horaStr = m.hora.toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
                const colorClase = m.tipo === 'ingreso' ? 'text-green' : 'text-red';
                const signo = m.tipo === 'ingreso' ? '+' : '-';
                return `<div class="report-item">
                            <span>${horaStr} - ${m.texto}</span>
                            <span class="${colorClase}">${signo}${formatearDinero(m.valor)}</span>
                        </div>`;
            }).join('');

            document.getElementById('lista-movimientos').innerHTML = listaHtml || '<p style="text-align:center; padding:10px;">No hay movimientos este día.</p>';
            document.getElementById('reporte-resultados').style.display = 'block';

        } catch (error) {
            alert('Error al generar el reporte: ' + error.message);
        }
    }
</script>

</body>
</html>
