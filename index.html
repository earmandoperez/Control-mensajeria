<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#3b2a1a">
<title>Control Mensajero</title>
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font:20px/1.35 system-ui,Arial,sans-serif;background:#f6f3ee;color:#222}
header{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:#3b2a1a;color:#fff;position:sticky;top:0;z-index:5}
header button{background:#fff;color:#3b2a1a;border:0;border-radius:10px;font-size:17px;font-weight:700;padding:10px 16px}
main{padding:14px 14px 100px;max-width:560px;margin:0 auto}
h1{font-size:28px;margin:0 0 10px;text-align:center}
h2{font-size:24px;margin:20px 0 8px}
label{display:block;font-weight:700;margin:16px 0 6px}
input,select{width:100%;font-size:22px;padding:14px;border:2px solid #888;border-radius:12px;background:#fff;color:#222}
input[type=checkbox]{width:28px;height:28px;margin:0 10px 0 0;vertical-align:middle}
.chk{font-weight:400}
.tr{background:#e8f0fb;border:2px solid #1f5fa8;border-radius:12px;padding:14px;font-size:22px;font-weight:700;margin-top:16px;color:#14427a}
.big{display:block;width:100%;min-height:72px;margin:12px 0;border:0;border-radius:16px;font-size:24px;font-weight:700;color:#fff;padding:12px;text-align:center;text-decoration:none}
.big small{display:block;font-size:17px;font-weight:400}
.g{background:#1b7f3b}.r{background:#c62828}.b{background:#1f5fa8}.x{background:#6b6b6b}
.gt{color:#1b7f3b}.rt{color:#c62828}.bt{color:#1f5fa8}.mut{color:#666}.c{text-align:center}
.sum{display:flex;gap:10px;margin:14px 0}
.sum>div{flex:1;background:#fff;border-radius:14px;padding:12px;text-align:center;border:2px solid #ddd}
.sum small{display:block;font-size:15px;color:#555}
.sum b{font-size:22px}
.card{background:#fff;border-radius:16px;padding:16px;border:3px solid #ccc;text-align:center;margin:10px 0}
.card.ingreso{border-color:#1b7f3b}.card.gasto{border-color:#c62828}.card.tf{border-color:#1f5fa8}
.card .amt{font-size:38px;font-weight:800;margin:6px 0}
.card b{font-size:26px}
.pill{display:inline-block;border-radius:20px;padding:6px 14px;font-size:18px;font-weight:700;background:#e6e6e6;margin:6px 0}
.pill.b{background:#1f5fa8;color:#fff}
.row{display:flex;align-items:center;gap:10px;background:#fff;border-radius:12px;padding:12px;margin:8px 0;border:1px solid #ddd}
.row[data-a]{border:2px solid #3b2a1a55}
.rn{flex:1;min-width:0;word-break:break-word}
.rn small{display:block;color:#666;font-size:16px}
.dot{width:36px;height:36px;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}
.dot.g{background:#1b7f3b}.dot.r{background:#c62828}.dot.b{background:#1f5fa8}
.vv{font-size:30px;font-weight:800;text-align:center;margin:8px 0}
.er{background:#ffe3e3;color:#9b1c1c;border:2px solid #c62828;border-radius:12px;padding:12px;margin:12px 0;font-weight:700}
.warn{background:#fff3cd;color:#7a5b00;border:2px solid #e0a800;border-radius:12px;padding:12px;margin:12px 0;font-weight:700}
.chips{display:flex;gap:8px}
.chip{flex:1;font-size:17px;padding:12px 4px;border:2px solid #3b2a1a;background:#fff;border-radius:12px;font-weight:700}
.sm{font-size:16px;padding:10px 14px;border:0;border-radius:10px;background:#c62828;color:#fff;font-weight:700}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:2px solid #bbb;z-index:5}
nav button{flex:1;padding:12px 2px;font-size:15px;font-weight:700;border:0;background:none;color:#3b2a1a}
nav button.on{background:#3b2a1a;color:#fff}
#modal{position:fixed;inset:0;background:#000a;z-index:20;overflow:auto;padding:16px}
.box{background:#fff;border-radius:18px;padding:16px;max-width:520px;margin:20px auto}
.msg{font-size:22px;margin:4px 0 8px}
#toast{position:fixed;left:16px;right:16px;bottom:90px;background:#222;color:#fff;border-radius:14px;padding:16px;font-size:22px;text-align:center;z-index:30}
.login{max-width:420px;margin:0 auto;padding:30px 16px}
details summary{font-weight:700;padding:12px 0}
</style>
</head>
<body>

<div id="login" class="login" hidden>
  <h1>🥐 Control de reparto</h1>
  <form id="lf">
    <label for="em">Correo</label>
    <input id="em" type="email" autocomplete="username" autocapitalize="none" required>
    <label for="pw">Clave</label>
    <input id="pw" type="password" autocomplete="current-password" required>
    <label class="chk" style="margin-top:12px"><input type="checkbox" id="sp">Ver la clave</label>
    <div id="le" class="er" hidden></div>
    <button class="big g" id="lb" type="submit">ENTRAR</button>
  </form>
</div>

<div id="app" hidden>
  <header><b id="who"></b><button data-a="salir">Salir</button></header>
  <main id="v"></main>
  <nav id="nav" hidden></nav>
</div>

<div id="modal" hidden></div>
<div id="toast" hidden></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,addDoc,getDocs,updateDoc,deleteDoc,doc,query,where,orderBy,limit,writeBatch} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const ADMIN="earmandoperez@gmail.com";
const fb=initializeApp({
  apiKey:"AIzaSyAN1TVPw6FLCzfhmQErOJzGT67mPLPWPAM",
  authDomain:"control-mensajeros-db12f.firebaseapp.com",
  projectId:"control-mensajeros-db12f",
  storageBucket:"control-mensajeros-db12f.firebasestorage.app",
  messagingSenderId:"191235884534",
  appId:"1:191235884534:web:b733d6762d37ce023373d7"
});
const auth=getAuth(fb), db=getFirestore(fb);

/* ---------- utilidades ---------- */
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>"$ "+Math.round(n||0).toString().replace(/\B(?=(\d{3})+(?!\d))/g,".");
const pad=n=>(n<10?"0":"")+n;
const iso=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const hoy=()=>iso(new Date());
const fmtF=f=>f.slice(8)+"/"+f.slice(5,7);
const V=h=>{$("v").innerHTML=h;window.scrollTo(0,0)};
const S={user:null,admin:false,contactos:[],hoy:[],byId:{},tab:"home",draft:null,saving:false,pend:[],rep:[]};
const reg=a=>a.forEach(m=>S.byId[m.id]=m);
const col=n=>collection(db,n);
let tt;
function toast(t){const e=$("toast");e.textContent=t;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>e.hidden=true,3000)}
function fail(e){toast("⚠ "+(e&&e.code==="permission-denied"?"No tiene permiso para esto.":"No funcionó. Revise la señal e intente de nuevo."))}
function loadFail(){V('<div class="er">No se pudo cargar. Revise la señal de internet.</div><button class="big b" data-a="go" data-v="'+S.tab+'">REINTENTAR</button>')}
function ask(msg,ok){return new Promise(r=>{
  const m=$("modal");
  m.innerHTML='<div class="box"><p class="msg">'+msg+'</p><button class="big g" id="mo">'+(ok||"Sí")+'</button><button class="big x" id="mc">No, volver</button></div>';
  m.hidden=false;
  $("mo").onclick=()=>{m.hidden=true;r(true)};
  $("mc").onclick=()=>{m.hidden=true;r(false)};
})}
function closeModal(){$("modal").hidden=true}
function er(t,id){const e=$(id||"er");e.textContent=t;e.hidden=false;e.scrollIntoView&&e.scrollIntoView(false)}
function digits(inp,out){inp.oninput=()=>{const d=inp.value.replace(/\D/g,"").replace(/^0+/,"");inp.value=d;if(out)out.textContent=money(+d||0)}}

/* ---------- acceso ---------- */
$("sp").onchange=()=>{$("pw").type=$("sp").checked?"text":"password"};
$("lf").onsubmit=async e=>{
  e.preventDefault();
  const b=$("lb"),le=$("le");
  le.hidden=true;b.disabled=true;b.textContent="Entrando…";
  try{await signInWithEmailAndPassword(auth,$("em").value.trim(),$("pw").value)}
  catch(x){
    const c=x.code||"";
    le.textContent=c==="auth/network-request-failed"?"No hay internet.":(c.indexOf("auth/")===0&&c!=="auth/too-many-requests")?"Correo o clave incorrectos.":c==="auth/too-many-requests"?"Demasiados intentos. Espere unos minutos.":"No se pudo entrar. Intente de nuevo.";
    le.hidden=false;
  }
  b.disabled=false;b.textContent="ENTRAR";
};
onAuthStateChanged(auth,async u=>{
  if(!u){S.user=null;$("app").hidden=true;$("login").hidden=false;$("pw").value="";return}
  S.user=u;S.admin=(u.email||"").toLowerCase()===ADMIN;
  $("who").textContent=S.admin?"👤 Administrador":"👤 Mensajero";
  buildNav();
  $("login").hidden=true;$("app").hidden=false;
  try{await loadContactos()}catch(e){}
  go("home");
});

/* ---------- navegación ---------- */
function buildNav(){
  const n=$("nav");
  if(!S.admin){n.hidden=true;return}
  n.hidden=false;
  n.innerHTML=[["home","🏠 Inicio"],["cierre","💰 Cierre"],["rep","📊 Reportes"],["cli","👥 Clientes"]]
    .map(x=>'<button data-a="go" data-v="'+x[0]+'" id="n_'+x[0]+'">'+x[1]+'</button>').join("");
}
function go(t){
  S.tab=t;S.draft=null;
  if(S.admin)["home","cierre","rep","cli"].forEach(k=>{const b=$("n_"+k);if(b)b.className=k===t?"on":""});
  ({home:home,cierre:cierre,rep:reportes,cli:clientes})[t]();
}

/* ---------- datos ---------- */
async function loadContactos(){
  const s=await getDocs(col("contactos"));
  S.contactos=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.nombre.localeCompare(b.nombre,"es"));
}
async function loadHoy(){
  const c=[where("fecha","==",hoy())];
  if(!S.admin)c.push(where("uid","==",S.user.uid));
  const s=await getDocs(query(col("movimientos"),...c));
  S.hoy=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>b.ts-a.ts);
}

/* Sumas: efectivo = ingresos que NO son transferencia; transferencias aparte */
const suma=(a,t)=>a.filter(m=>m.tipo===t).reduce((s,m)=>s+m.valor,0);
const ingEf=a=>a.filter(m=>m.tipo==="ingreso"&&!m.transf).reduce((s,m)=>s+m.valor,0);
const ingTf=a=>a.filter(m=>m.tipo==="ingreso"&&m.transf).reduce((s,m)=>s+m.valor,0);
const cntTf=a=>a.filter(m=>m.tipo==="ingreso"&&m.transf).length;

function lista(a,o){
  o=o||{};reg(a);
  if(!a.length)return '<p class="c mut">No hay anotaciones.</p>';
  return a.map(m=>{
    const i=m.tipo==="ingreso",tf=i&&m.transf;
    const sub=[o.date?fmtF(m.fecha):"",tf?"🏦 Transferencia":"",esc(m.nota)].filter(Boolean).join(" · ");
    return '<div class="row"'+(o.edit?' data-a="edit" data-id="'+m.id+'"':'')+'><span class="dot '+(i?(tf?"b":"g"):"r")+'">'+(i?"＋":"－")+'</span><div class="rn"><b>'+esc(m.nombre)+'</b><small>'+sub+'</small></div><b class="'+(i?(tf?"bt":"gt"):"rt")+'">'+money(m.valor)+'</b></div>';
  }).join("");
}

/* ---------- INICIO ---------- */
async function home(){
  V('<p class="c">Cargando…</p>');
  try{await loadHoy()}catch(e){return loadFail()}
  const ing=suma(S.hoy,"ingreso"),gas=suma(S.hoy,"gasto"),tf=ingTf(S.hoy);
  const f=new Date().toLocaleDateString("es-CO",{weekday:"long",day:"numeric",month:"long"});
  V('<p class="c mut" style="margin:0">'+esc(f)+'</p>'+
    '<button class="big g" data-a="nuevo" data-t="ingreso">＋ INGRESO<small>Un cliente pagó</small></button>'+
    '<button class="big r" data-a="nuevo" data-t="gasto">－ GASTO<small>Una compra</small></button>'+
    '<div class="sum"><div><small>Ingresos de hoy</small><b class="gt">'+money(ing)+'</b></div><div><small>Gastos de hoy</small><b class="rt">'+money(gas)+'</b></div></div>'+
    (tf>0?'<p class="c bt" style="margin:0;font-weight:700">🏦 Incluye '+money(tf)+' en transferencias</p>':'')+
    '<h2>Anotado hoy</h2>'+(S.admin&&S.hoy.length?'<p class="mut" style="margin:0 0 6px;font-size:16px">Toque una anotación para corregirla.</p>':'')+
    lista(S.hoy,{edit:S.admin}));
}

/* ---------- NUEVO MOVIMIENTO ---------- */
function nuevo(t){
  const l=S.contactos.filter(c=>c.tipo===t),ing=t==="ingreso",dr=S.draft;
  V('<h2 class="'+(ing?"gt":"rt")+'">'+(ing?"Nuevo INGRESO":"Nuevo GASTO")+'</h2>'+
    '<label>'+(ing?"¿Quién pagó?":"¿Dónde compró?")+'</label>'+
    '<select id="sel"><option value="">— Toque aquí para elegir —</option>'+l.map(c=>'<option value="'+esc(c.nombre)+'">'+esc(c.nombre)+'</option>').join("")+'<option value="__otro">➕ Otro (escribir nombre)</option></select>'+
    '<div id="otro" hidden><label>Escriba el nombre</label><input id="nom" type="text" autocomplete="off"><label class="chk" style="margin-top:14px"><input type="checkbox" id="fav">Guardar en la lista para la próxima vez</label></div>'+
    '<label>Valor</label><input id="val" type="tel" inputmode="numeric" placeholder="0" autocomplete="off"><div id="vv" class="vv">$ 0</div>'+
    (ing?'<label class="chk tr"><input type="checkbox" id="tr">🏦 Este pago es transferencia</label>':'')+
    '<label>Nota (si quiere)</label><input id="not" type="text" autocomplete="off">'+
    '<div id="er" class="er" hidden></div>'+
    '<button class="big '+(ing?"g":"r")+'" data-a="seguir" data-t="'+t+'">CONTINUAR ➜</button>'+
    '<button class="big x" data-a="go" data-v="'+S.tab+'">Cancelar</button>');
  const sel=$("sel");
  sel.onchange=()=>{$("otro").hidden=sel.value!=="__otro"};
  digits($("val"),$("vv"));
  if(dr){
    sel.value=dr.isNew?"__otro":dr.nombre;
    $("nom").value=dr.isNew?dr.nombre:"";
    $("fav").checked=!!dr.fav;
    $("val").value=dr.valor;$("vv").textContent=money(dr.valor);
    $("not").value=dr.nota;
    if(ing)$("tr").checked=!!dr.transf;
  }else if(!l.length)sel.value="__otro";
  $("otro").hidden=sel.value!=="__otro";
}
function seguir(t){
  const s=$("sel").value,isNew=s==="__otro";
  const nombre=(isNew?$("nom").value:s).trim().replace(/\s+/g," ");
  const valor=parseInt($("val").value,10)||0;
  if(!nombre)return er(isNew?"Escriba el nombre.":"Falta elegir el nombre.");
  if(valor<=0)return er("Falta escribir el valor.");
  S.draft={t,nombre,valor,nota:$("not").value.trim(),isNew,fav:isNew&&$("fav").checked,transf:t==="ingreso"&&$("tr").checked};
  confirmar();
}
function confirmar(){
  const d=S.draft,ing=d.t==="ingreso";
  let w="";
  if(d.valor>=500000)w+='<div class="warn">⚠ Es un valor muy alto. Revise que no sobren ceros.</div>';
  if(S.hoy.some(m=>m.tipo===d.t&&m.nombre.toLowerCase()===d.nombre.toLowerCase()&&m.valor===d.valor))w+='<div class="warn">⚠ Hoy ya se anotó lo mismo (mismo nombre y mismo valor). ¿Seguro que no está repetido?</div>';
  const cls=d.transf?"tf":d.t;
  V('<h2 class="c">¿Está todo bien?</h2>'+
    '<div class="card '+cls+'"><small>'+(ing?"INGRESO":"GASTO")+'</small><br><b>'+esc(d.nombre)+'</b><div class="amt '+(ing?(d.transf?"bt":"gt"):"rt")+'">'+money(d.valor)+'</div>'+
    (ing?(d.transf?'<div class="pill b">🏦 TRANSFERENCIA</div>':'<div class="pill">💵 Efectivo</div>'):'')+
    (d.nota?'<div>'+esc(d.nota)+'</div>':'')+(d.fav?'<small class="mut">Se guardará en la lista</small>':'')+'</div>'+w+
    '<button class="big g" id="gb" data-a="guardar">✔ SÍ, GUARDAR</button>'+
    '<button class="big x" data-a="corregir">✎ CORREGIR</button>');
}
async function guardar(){
  if(S.saving)return;
  S.saving=true;
  const b=$("gb");if(b){b.textContent="Guardando… no toque nada";b.style.opacity=".6"}
  const d=S.draft;
  try{
    await addDoc(col("movimientos"),{tipo:d.t,nombre:d.nombre,valor:d.valor,nota:d.nota,transf:!!d.transf,fecha:hoy(),ts:Date.now(),uid:S.user.uid,email:S.user.email,cerrado:false});
    if(d.fav&&!S.contactos.some(c=>c.tipo===d.t&&c.nombre.toLowerCase()===d.nombre.toLowerCase())){
      await addDoc(col("contactos"),{nombre:d.nombre,tipo:d.t});
      await loadContactos();
    }
    S.draft=null;toast("✔ Guardado");S.saving=false;await home();
  }catch(e){S.saving=false;fail(e);if(b){b.textContent="✔ SÍ, GUARDAR";b.style.opacity="1"}}
}

/* ---------- EDITAR (admin) ---------- */
function edit(id){
  const m=S.byId[id];if(!m)return;
  const o=$("modal");
  o.innerHTML='<div class="box"><h2 style="margin-top:0">Corregir anotación</h2>'+
    (m.cerrado?'<div class="warn">Esta anotación ya fue incluida en un cierre.</div>':'')+
    '<label>Tipo</label><select id="e_t"><option value="ingreso">Ingreso</option><option value="gasto">Gasto</option></select>'+
    '<label>Nombre</label><input id="e_n" type="text">'+
    '<label>Valor</label><input id="e_v" type="tel" inputmode="numeric">'+
    '<label class="chk tr" id="e_trw"><input type="checkbox" id="e_tr">🏦 Este pago es transferencia</label>'+
    '<label>Nota</label><input id="e_o" type="text">'+
    '<label>Fecha</label><input id="e_f" type="date">'+
    '<div id="e_er" class="er" hidden></div>'+
    '<button class="big g" id="e_s">GUARDAR CAMBIOS</button>'+
    '<button class="big r" id="e_d">BORRAR ESTA ANOTACIÓN</button>'+
    '<button class="big x" id="e_c">Cancelar</button></div>';
  o.hidden=false;
  $("e_t").value=m.tipo;$("e_n").value=m.nombre;$("e_v").value=m.valor;$("e_o").value=m.nota||"";$("e_f").value=m.fecha;
  $("e_tr").checked=!!m.transf;
  $("e_trw").hidden=m.tipo!=="ingreso";
  $("e_t").onchange=()=>{$("e_trw").hidden=$("e_t").value!=="ingreso"};
  digits($("e_v"));
  $("e_c").onclick=closeModal;
  $("e_s").onclick=async()=>{
    const n=$("e_n").value.trim(),v=parseInt($("e_v").value,10)||0,f=$("e_f").value,t=$("e_t").value;
    if(!n||v<=0||!f)return er("Revise nombre, valor y fecha.","e_er");
    try{
      await updateDoc(doc(db,"movimientos",id),{tipo:t,nombre:n,valor:v,nota:$("e_o").value.trim(),fecha:f,transf:t==="ingreso"&&$("e_tr").checked});
      closeModal();toast("✔ Corregido");refrescar();
    }catch(e){closeModal();fail(e)}
  };
  $("e_d").onclick=async()=>{
    closeModal();
    if(!await ask("¿Borrar <b>"+esc(m.nombre)+"</b> por <b>"+money(m.valor)+"</b>?<br>No se puede deshacer.","Sí, borrar"))return;
    try{await deleteDoc(doc(db,"movimientos",id));toast("✔ Borrado");refrescar()}catch(e){fail(e)}
  };
}
function refrescar(){if(S.tab==="rep"&&$("d1"))verrep();else go(S.tab)}

/* ---------- CIERRE (admin) ---------- */
async function cierre(){
  V('<p class="c">Cargando…</p>');
  try{
    const s=await getDocs(query(col("movimientos"),where("cerrado","==",false)));
    S.pend=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.fecha<b.fecha?-1:a.fecha>b.fecha?1:a.ts-b.ts);
    const h=await getDocs(query(col("cierres"),orderBy("ts","desc"),limit(8)));
    var hist=h.docs.map(d=>d.data());
  }catch(e){return loadFail()}
  const p=S.pend,ie=ingEf(p),it=ingTf(p),gas=suma(p,"gasto"),neto=ie-gas;
  let html='<h2>Cierre de caja</h2>';
  if(!p.length)html+='<p class="c mut">No hay nada pendiente por cerrar.</p>';
  else{
    html+='<p class="mut" style="margin:0">Del '+fmtF(p[0].fecha)+' al '+fmtF(p[p.length-1].fecha)+' · '+p.length+' anotaciones</p>'+
    '<div class="sum"><div><small>💵 Ingresos en efectivo</small><b class="gt">'+money(ie)+'</b></div><div><small>Gastos</small><b class="rt">'+money(gas)+'</b></div></div>'+
    '<div class="card"><small>💵 EFECTIVO QUE DEBE ENTREGAR</small><div class="amt">'+money(neto)+'</div></div>'+
    '<div class="card tf"><small>🏦 TRANSFERENCIAS (aparte, no es efectivo)</small><div class="amt bt">'+money(it)+'</div><small>'+cntTf(p)+(cntTf(p)===1?" pago":" pagos")+'</small></div>'+
    '<p class="c mut" style="margin:4px 0">Total vendido (efectivo + transferencias): <b>'+money(ie+it)+'</b></p>'+
    '<label>Efectivo que recibió</label><input id="rec" type="tel" inputmode="numeric" placeholder="0">'+
    '<div id="dif" class="vv" style="font-size:24px"></div>'+
    '<div id="er" class="er" hidden></div>'+
    '<button class="big g" data-a="cerrar">CERRAR CAJA</button>'+
    '<details><summary>Ver las '+p.length+' anotaciones</summary>'+lista(p,{edit:true,date:true})+'</details>';
  }
  if(hist.length)html+='<h2>Cierres anteriores</h2>'+hist.map(c=>'<div class="row"><div class="rn"><b>'+fmtF(c.fecha)+'</b><small>'+fmtF(c.desde)+' al '+fmtF(c.hasta)+' · debía '+money(c.neto)+(c.ingTransf?' · 🏦 '+money(c.ingTransf):'')+'</small></div><b>'+money(c.recibido)+'</b></div>').join("");
  V(html);
  if($("rec")){
    digits($("rec"));
    $("rec").addEventListener("input",()=>{
      const r=parseInt($("rec").value,10)||0,d=r-neto,e=$("dif");
      e.textContent=!$("rec").value?"":d===0?"✔ Cuadra exacto":d<0?"Faltan "+money(-d):"Sobran "+money(d);
      e.className="vv "+(d===0?"gt":d<0?"rt":"");
    });
  }
}
async function cerrar(){
  const p=S.pend;if(!p.length||S.saving)return;
  const ie=ingEf(p),it=ingTf(p),gas=suma(p,"gasto"),neto=ie-gas;
  const rv=$("rec").value;
  if(!rv)return er("Escriba cuánto efectivo recibió (si fue cero, escriba 0).");
  const rec=parseInt(rv,10)||0,d=rec-neto;
  if(!await ask("¿Cerrar la caja?<br><br>💵 Debía entregar: <b>"+money(neto)+"</b><br>Recibió: <b>"+money(rec)+"</b><br>"+(d===0?"✔ Cuadra":d<0?"Faltan <b>"+money(-d)+"</b>":"Sobran <b>"+money(d)+"</b>")+"<br><br>🏦 Transferencias: <b>"+money(it)+"</b><br><br>Las "+p.length+" anotaciones quedarán cerradas.","Sí, cerrar caja"))return;
  S.saving=true;
  try{
    const ref=doc(col("cierres"));
    const cd={ts:Date.now(),fecha:hoy(),desde:p[0].fecha,hasta:p[p.length-1].fecha,ingEfectivo:ie,ingTransf:it,ingresos:ie+it,gastos:gas,neto:neto,recibido:rec,n:p.length};
    for(let i=0;i<p.length;i+=450){
      const b=writeBatch(db);
      if(i===0)b.set(ref,cd);
      p.slice(i,i+450).forEach(m=>b.update(doc(db,"movimientos",m.id),{cerrado:true,cierreId:ref.id}));
      await b.commit();
    }
    S.saving=false;toast("✔ Caja cerrada");cierre();
  }catch(e){S.saving=false;fail(e)}
}

/* ---------- REPORTES (admin) ---------- */
function reportes(){
  const d=new Date();
  V('<h2>Reportes</h2>'+
    '<div class="chips"><button class="chip" data-a="rango" data-r="hoy">Hoy</button><button class="chip" data-a="rango" data-r="7">7 días</button><button class="chip" data-a="rango" data-r="mes">Este mes</button></div>'+
    '<label>Desde</label><input type="date" id="d1" value="'+iso(new Date(d.getFullYear(),d.getMonth(),1))+'">'+
    '<label>Hasta</label><input type="date" id="d2" value="'+hoy()+'">'+
    '<div id="er" class="er" hidden></div>'+
    '<button class="big b" data-a="verrep">VER REPORTE</button><div id="rep"></div>');
}
function rango(r){
  const d=new Date(),h=hoy();let i=h;
  if(r==="7"){const x=new Date();x.setDate(x.getDate()-6);i=iso(x)}
  if(r==="mes")i=iso(new Date(d.getFullYear(),d.getMonth(),1));
  $("d1").value=i;$("d2").value=h;verrep();
}
const grupo=(a,t)=>{const g={};a.filter(m=>m.tipo===t).forEach(m=>{const k=m.nombre.toLowerCase();g[k]=g[k]||{n:m.nombre,v:0,c:0};g[k].v+=m.valor;g[k].c++});return Object.values(g).sort((x,y)=>y.v-x.v)};
const grow=(a,c)=>a.map(x=>'<div class="row"><div class="rn"><b>'+esc(x.n)+'</b><small>'+x.c+(x.c===1?" vez":" veces")+'</small></div><b class="'+c+'">'+money(x.v)+'</b></div>').join("")||'<p class="c mut">—</p>';
async function verrep(){
  const d1=$("d1").value,d2=$("d2").value,box=$("rep");
  if(!d1||!d2||d1>d2)return er("Revise las fechas: «Desde» no puede ser después de «Hasta».");
  $("er").hidden=true;
  box.innerHTML='<p class="c">Cargando…</p>';
  try{
    const s=await getDocs(query(col("movimientos"),where("fecha",">=",d1),where("fecha","<=",d2)));
    S.rep=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>a.fecha<b.fecha?1:a.fecha>b.fecha?-1:b.ts-a.ts);
  }catch(e){box.innerHTML="";return fail(e)}
  const a=S.rep,ing=suma(a,"ingreso"),gas=suma(a,"gasto"),ie=ingEf(a),it=ingTf(a);
  const txt="Reporte "+fmtF(d1)+" al "+fmtF(d2)+"\nIngresos: "+money(ing)+"\n  - Efectivo: "+money(ie)+"\n  - Transferencias: "+money(it)+"\nGastos: "+money(gas)+"\nNeto: "+money(ing-gas)+"\nEfectivo neto (efectivo - gastos): "+money(ie-gas);
  box.innerHTML='<h2>Resultado</h2><div class="sum"><div><small>Ingresos</small><b class="gt">'+money(ing)+'</b></div><div><small>Gastos</small><b class="rt">'+money(gas)+'</b></div></div>'+
    '<div class="sum"><div><small>💵 En efectivo</small><b>'+money(ie)+'</b></div><div><small>🏦 Transferencias</small><b class="bt">'+money(it)+'</b></div></div>'+
    '<div class="card"><small>NETO (ingresos - gastos)</small><div class="amt '+(ing-gas<0?"rt":"gt")+'">'+money(ing-gas)+'</div><small>'+a.length+' anotaciones</small></div>'+
    '<a class="big g" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(txt)+'">Enviar resumen por WhatsApp</a>'+
    '<h2>Ingresos por cliente</h2>'+grow(grupo(a,"ingreso"),"gt")+
    '<h2>Gastos por lugar</h2>'+grow(grupo(a,"gasto"),"rt")+
    '<h2>Detalle</h2>'+lista(a.slice(0,300),{edit:true,date:true})+(a.length>300?'<p class="c mut">Se muestran las 300 más recientes.</p>':'');
}

/* ---------- CLIENTES (admin) ---------- */
function clientes(){
  const bloque=(t,tit)=>'<h2>'+tit+'</h2>'+(S.contactos.filter(c=>c.tipo===t).map(c=>'<div class="row"><b class="rn">'+esc(c.nombre)+'</b><button class="sm" data-a="delc" data-id="'+c.id+'">Quitar</button></div>').join("")||'<p class="c mut">La lista está vacía.</p>');
  V(bloque("ingreso","Clientes (ingresos)")+bloque("gasto","Lugares (gastos)")+'<p class="mut" style="font-size:16px">Para agregar uno nuevo, regístrelo desde Inicio y marque «Guardar en la lista».</p>');
}
async function delc(id){
  const c=S.contactos.find(x=>x.id===id);if(!c)return;
  if(!await ask("¿Quitar <b>"+esc(c.nombre)+"</b> de la lista?<br>Las anotaciones ya hechas no se borran.","Sí, quitar"))return;
  try{await deleteDoc(doc(db,"contactos",id));await loadContactos();clientes();toast("✔ Quitado")}catch(e){fail(e)}
}

/* ---------- acciones ---------- */
const A={
  go:d=>go(d.v),
  nuevo:d=>{S.draft=null;nuevo(d.t)},
  seguir:d=>seguir(d.t),
  corregir:()=>nuevo(S.draft.t),
  guardar:guardar,
  edit:d=>edit(d.id),
  cerrar:cerrar,
  rango:d=>rango(d.r),
  verrep:verrep,
  delc:d=>delc(d.id),
  salir:async()=>{if(await ask("¿Salir de la aplicación?","Sí, salir"))signOut(auth)}
};
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-a]");
  if(t&&A[t.dataset.a])A[t.dataset.a](t.dataset);
});
</script>
